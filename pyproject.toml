[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dc-632-26"
dynamic = ["version"]
description = 'Digital Communications (ECE 632, Fall 2026)'
readme = "README.md"
requires-python = ">=3.8"
license = "CC0-1.0"
keywords = ["Digital communications", "Transmitter", "receiver", "DSP", "Modulation", "Demodulation", "Signal processing"]
authors = [
  { name = "Peter Paris", email = "pparis@gmu.edu" },
]
classifiers = [
  "Development Status :: 1 - Planning",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]

dependencies = [
  "numpy>=2.5.0",
  "scipy>=1.18.0",
  "matplotlib>=3.11.0",
  "seaborn>=0.13.0",
  "jupyterlab>=4.5.0",
  "sounddevice>=0.5.6",
  "pytest>=9.0.0",
  "black>=26.0.0",
  "flake8>=7.0.0",
]

[project.urls]
Documentation = "https://github.com/bepepa/dc-632-26#readme"
Issues = "https://github.com/bepepa/dc-632-26/issues"
Source = "https://github.com/bepepa/dc-632-26"

[tool.hatch.version]
path = "src/dc_632_26/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/dc_632_26 tests}"

[tool.coverage.run]
source_pkgs = ["dc_632_26", "tests"]
branch = true
parallel = true
omit = [
  "src/dc_632_26/__about__.py",
]

[tool.coverage.paths]
dc_632_26 = ["src/dc_632_26", "*/dc-632-26/src/dc_632_26"]
tests = ["tests", "*/dc-632-26/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
